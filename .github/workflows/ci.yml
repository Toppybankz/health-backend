name: Backend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  test-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run unit tests and JavaScript syntax checks
        run: npm run check
